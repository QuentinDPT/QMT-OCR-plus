                            c0.92-1.514,1.627-3.179,2.08-4.943h2.438c1.383,0,2.52-1.087,2.52-2.471v-4.125C45.973,19.555,44.837,18.443,43.454,18.443z
                            M22.976,30.85c-4.378,0-7.928-3.517-7.928-7.852c0-4.338,3.55-7.85,7.928-7.85c4.379,0,7.931,3.512,7.931,7.85
                            C30.906,27.334,27.355,30.85,22.976,30.85z"/>
                    </g>
                </g>
            </g>
        </g>
        
        
        <!-- Hollow -->
        <g transform-origin="top left" transform="translate(70,70)">
            <polygon points="0,0 70,-70 130,-70 60,0" fill="url(#hollow)" stroke="none"/>
            <polygon points="60,0 130,-70 130,-10 60,60" fill="url(#hollow-horizontal)" stroke="none"/>

            <polygon points="0,0 70,-70 70,-10 0,60" fill="url(#hollow-horizontal)" stroke="none"/>
            <polygon points="0,60 70,-10 130,-10 60,60" fill="url(#hollow)" stroke="none"/>
        </g>
    </g>
</svg>
