<svg width="800px" height="800px" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">
     <style>
        .iso-context {
            transform: rotate(-45deg) skew(15deg, 15deg);
            transform-origin: center;
        }

        .iso-top { }

        .iso-left {
            transform-origin: 25px 0;
            transform: translateY(-15px) skewY(-45deg);
        }

        .iso-right {
            transform: skewX(-45deg);
        }

        :root {
            --primary-color: #1e1264;
            --secondary-color: #72efe9;
            --tertiary-color: #494399;

            --measure-light-color: #99f;
        }

    </style>

    <defs>
        <linearGradient id="hollow" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="var(--measure-light-color)" stop-opacity=".7" />
            <stop offset="100%" stop-color="var(--measure-light-color)" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="hollow-horizontal" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="var(--measure-light-color)" stop-opacity=".7" />
            <stop offset="100%" stop-color="var(--measure-light-color)" stop-opacity="0" />
        </linearGradient>
    </defs>

    <g class="iso-context" stroke="#ddd" stroke-width=".4">

        <!-- Board -->
        <g fill="var(--measure-light-color)">
            <!-- BOTTOM -->
            <g transform="translate(70, 130)">
                <rect class="iso-right" x="0" y="0" width="60" height="3"/>
            </g>

            <!-- LEFT -->
            <g transform="translate(67,63)">
                <rect class="iso-left" x="0" y="0" width="3" height="60"/>
            </g>

            <rect class="iso-top" x="70" y="70" width="60" height="60"/>
            <rect class="iso-top" x="77.5" y="77.5" width="45" height="45" fill="var(--board-chip-color)" stroke="none"/>
        </g>

        <!-- Object -->
        <g  fill="#777" stroke="#fff">

