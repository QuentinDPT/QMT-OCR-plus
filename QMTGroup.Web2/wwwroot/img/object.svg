                <g transform="translate(-.4,.3)">
                    <polygon points="90,95.2 95,95 92,93.2" 
                            stroke="none" 
                            stroke-width=".2" />
                </g>
                <g transform="translate(-.2,8.2)">
                    <polygon points="90,95.2 95,95 92,93.2" 
                            stroke="none"
                            stroke-width=".2" />
                </g>
                <g transform="translate(3.1,-4.3)">
                    <polygon points="90,95.2 95,95 92,93.2" 
                            stroke="none"
                            stroke-width=".2" />
